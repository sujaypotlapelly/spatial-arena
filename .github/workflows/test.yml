name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Simulator, harness and arena tests
        run: node --test 'sim/test/*.test.mjs' arena/test/determinism.test.mjs
      - name: No-key smoke run (stand-in model and scripted pilots)
        run: node sim/tools/bench.mjs --demo
      - name: Server tests
        run: python3 -m unittest discover -s tests
